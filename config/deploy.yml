service: two_rivers_reporter
image: andrerobitaille/two_rivers_reporter

servers:
  web:
    - 178.156.250.235

proxy:
  ssl: true
  host: tworiversmatters.com

registry:
  server: ghcr.io
  username: AndreRobitaille
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - TWO_RIVERS_REPORTER_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: two_rivers_reporter-db
    WEB_CONCURRENCY: 2
    RAILS_LOG_LEVEL: info
    GA_MEASUREMENT_ID: G-KEC1YZ61WZ
    GENERATED_IMAGES_ENABLED: "true"

    # Absolute URLs in transactional email are built from this. A bare path in
    # an email is not clickable, so a wrong value here silently breaks sign-in.
    APP_HOST: tworiversmatters.com

    # WebAuthn is [SecureContext]-only and rp_id must match the live domain.
    # The initializer defaults to "localhost"; unset here, passkeys would fail
    # on production with no error raised anywhere.
    WEBAUTHN_ORIGIN: https://tworiversmatters.com
    WEBAUTHN_RP_ID: tworiversmatters.com
    WEBAUTHN_RP_NAME: Two Rivers Matters

    ADMIN_NOTIFICATION_EMAIL: andre@tworiversmatters.com

    # Loops transactional template ids. Not secrets — they identify templates,
    # they do not authorise anything; LOOPS_API_KEY is the credential.
    # All five are required in production: config/initializers/
    # verify_transactional_email_ids.rb refuses to boot without them, because a
    # partial setup would answer 500 for unknown addresses and 302 for real
    # ones, which is the account-enumeration leak the identical response exists
    # to prevent.
    LOOPS_MAGIC_LINK_TRANSACTIONAL_ID: cms0uhdt5147h0j0hixl946xa
    LOOPS_APPLICATION_LINK_TRANSACTIONAL_ID: cms0uszcu14lm0j0hq9e5a3o0
    LOOPS_ADMIN_APPLICATION_NOTIFICATION_TRANSACTIONAL_ID: cms0ux49w00510jvlhvgj00d0
    LOOPS_NO_ACCOUNT_TRANSACTIONAL_ID: cms0v0mnr00aw0jx8hodlsdl2
    LOOPS_APPLICATION_PENDING_TRANSACTIONAL_ID: cms0v4kom00hw0jyttkozowl0

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "two_rivers_reporter_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: pgvector/pgvector:pg17
    host: 178.156.250.235
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: two_rivers_reporter_production
        POSTGRES_USER: two_rivers_reporter
      secret:
        - POSTGRES_PASSWORD
    files:
      - config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    directories:
      - two_rivers_reporter_pgdata:/var/lib/postgresql/data
