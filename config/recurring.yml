production:
  discover_spring_candidate_filings:
    class: DiscoverElectionFilingsJob
    queue: default
    schedule: "0 18 * 1-4 * America/Chicago"
  discover_spring_forums:
    class: DiscoverElectionForumsJob
    queue: default
    schedule: "30 7 * 2,3,4 * America/Chicago"
  discover_spring_htr_questionnaires:
    class: DiscoverHtrQuestionnairesJob
    queue: default
    schedule: "15 7 * 3,4 * America/Chicago"
  refresh_crawler_ip_ranges:
    class: Crawlers::RefreshIpRangesJob
    queue: default
    schedule: every hour at minute 7
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  refresh_topic_descriptions:
    class: Topics::RefreshDescriptionsJob
    queue: default
    schedule: every Monday at 3am
  daily_meeting_discovery:
    class: Scrapers::DiscoverMeetingsJob
    queue: default
    args: ["nightly"]
    schedule: "0 23 * * * America/Chicago"
  extract_knowledge_patterns:
    class: ExtractKnowledgePatternsJob
    queue: default
    schedule: every Monday at 3:30am
  refresh_generated_images_homepage_topics:
    class: GeneratedImages::RefreshHomepageTopicsJob
    queue: default
    schedule: every 6 hours
  cleanup_expired_auth_records:
    class: ExpiredAuthRecordsCleanupJob
    queue: default
    schedule: every day at 4am
