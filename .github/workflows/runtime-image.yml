name: Runtime image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .ruby-version
      - Gemfile
      - Gemfile.lock
      - app/**
      - config/**
      - db/**
      - lib/**
      - vendor/**
      - public/**
      - bin/**
      - script/**
      - .kamal/**
      - .github/workflows/runtime-image.yml
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and smoke-test with isolated synthetic databases
        run: bash script/build_production_image "$GITHUB_SHA" "$RUNNER_TEMP/production-image"
      - name: Preserve build and startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-checks-${{ github.sha }}
          path: ${{ runner.temp }}/production-image/checks
          retention-days: 7
      - name: Export verified image for manual publication
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/release-image"
          docker save trr-production:verified | gzip -1 > "$RUNNER_TEMP/release-image/image.tar.gz"
          cp "$RUNNER_TEMP/production-image/checks/revision.txt" "$RUNNER_TEMP/release-image/revision.txt"
          cd "$RUNNER_TEMP/release-image"
          sha256sum image.tar.gz revision.txt > SHA256SUMS
      - name: Retain release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/release-image
          retention-days: 3
          compression-level: 0
